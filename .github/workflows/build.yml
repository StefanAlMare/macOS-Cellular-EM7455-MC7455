name: Build

on:
  push:
  pull_request:

jobs:
  package-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: brew install libusb
      - name: Build package
        run: |
          cd Installer
          chmod +x build-pkg.sh
          ./build-pkg.sh
      - name: Upload unsigned/ad-hoc package
        uses: actions/upload-artifact@v4
        with:
          name: Cellular-pkg
          path: Installer/Release/*.pkg
